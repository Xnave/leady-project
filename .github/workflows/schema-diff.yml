# Production job name must match the required ruleset check on main
# ("Diff against production"). Staging may fail (red) but continue-on-error
# means it does not fail the workflow or block merge — only production does.
#
# Secrets live on GitHub environments: Preview has STAGING_DATABASE_URL,
# Production has PRODUCTION_DATABASE_URL.

name: Schema diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  staging:
    name: Diff against staging
    runs-on: ubuntu-latest
    environment: Preview
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema matches staging
        env:
          DATABASE_URL_FROM_ENV: "1"
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:diff:check:staging

  production:
    name: Diff against production
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema matches production
        env:
          DATABASE_URL_FROM_ENV: "1"
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm db:diff:check:production
