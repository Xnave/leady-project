# Leady — nginx reverse proxy (project-local, no Cloudflare)
# Prefix: nginx/  (see scripts/proxy.sh)

worker_processes 1;
error_log run/error.log info;
pid run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log run/access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream leady_app {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # HTTP — local dev (always :8080)
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name localhost 127.0.0.1 _;

        location / {
            proxy_pass http://leady_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }

    # HTTPS — generated when LEADY_DOMAIN + certs exist (ssl.active.conf)
    include ssl.active.conf;
}
