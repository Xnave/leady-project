<title>Zapidly פניות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* ---------- tokens: main's globals.css palette (WhatsApp green) ---------- */
:root {
  --bg: #f0f2f5; --bg-elevated: #f7f8fa; --bg-sunken: #eaedf0;
  --card: #ffffff; --card-hover: #f5f6f6;
  --line: #e9edef; --line-strong: #d1d7db; --line-control: #7d8b94;
  --text: #111b21; --text-soft: #3b4a54; --muted: #5a6a75;
  --accent: #008069; --accent-bright: #00a884; --accent-hover: #026a56;
  --accent-soft: #eefbf8; --accent-line: #a8e2d2; --accent-glow: rgba(0,168,132,.22);
  --on-accent: #ffffff;
  --wa-green: #25d366; --on-wa-green: #072b1c;
  --wa-header: #008069; --on-wa-header: #ffffff;
  /* inverse surface for toasts + bulk bar */
  --inverse: #111b21; --on-inverse: #ffffff; --inverse-hover: rgba(255,255,255,.12); --inverse-link: #25d366;
  --danger: #c6273e; --danger-soft: #fdecee;
  --warning: #9a6200; --warning-soft: #fff4dc; --warning-line: #f0d59a;
  --info: #027eb5; --info-soft: #e5f4fb;
  --chat-bg: #efeae2; --bubble-in: #ffffff; --bubble-out: #d9fdd3; --bubble-text: #111b21;
  --wa-dot: #25d366;
  --scrim: rgba(11,20,26,.28);
  --shadow-sm: 0 1px 2px rgba(11,20,26,.06);
  --shadow: 0 2px 10px rgba(11,20,26,.08);
  --shadow-lg: 0 14px 40px rgba(11,20,26,.18);
  --font-sans: "Inter", "Noto Sans Hebrew", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* one step up from the current 11-24 scale */
  --fs-2xs: 12px; --fs-xs: 13px; --fs-sm: 14px; --fs-md: 15px; --fs-lg: 17px; --fs-xl: 22px; --fs-2xl: 28px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-xs: 6px; --radius-sm: 8px; --radius: 12px; --radius-lg: 16px; --radius-pill: 999px;
  --hit: 38px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --t-fast: 110ms var(--ease-out); --t: 160ms var(--ease-out);
  --sidebar-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b141a; --bg-elevated: #131c22; --bg-sunken: #070d11;
    --card: #111b21; --card-hover: #182229;
    --line: #222e35; --line-strong: #2f3b43; --line-control: #6a7175;
    --text: #e9edef; --text-soft: #d1d7db; --muted: #8696a0;
    --accent: #00a884; --accent-bright: #00a884; --accent-hover: #06cf9c;
    --accent-soft: rgba(0,168,132,.14); --accent-line: rgba(0,168,132,.45); --accent-glow: rgba(0,168,132,.26);
    --on-accent: #05251d;
    --wa-header: #202c33; --on-wa-header: #e9edef;
    --inverse: #e9edef; --on-inverse: #111b21; --inverse-hover: rgba(17,27,33,.1); --inverse-link: #008069;
    --danger: #f15c6d; --danger-soft: rgba(241,92,109,.14);
    --warning: #ffb74d; --warning-soft: rgba(255,183,77,.14); --warning-line: rgba(255,183,77,.35);
    --info: #53bdeb; --info-soft: rgba(83,189,235,.14);
    --chat-bg: #0b141a; --bubble-in: #202c33; --bubble-out: #005c4b; --bubble-text: #e9edef;
    --scrim: rgba(0,0,0,.5);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 2px 10px rgba(0,0,0,.45); --shadow-lg: 0 14px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b141a; --bg-elevated: #131c22; --bg-sunken: #070d11;
  --card: #111b21; --card-hover: #182229;
  --line: #222e35; --line-strong: #2f3b43; --line-control: #6a7175;
  --text: #e9edef; --text-soft: #d1d7db; --muted: #8696a0;
  --accent: #00a884; --accent-bright: #00a884; --accent-hover: #06cf9c;
  --accent-soft: rgba(0,168,132,.14); --accent-line: rgba(0,168,132,.45); --accent-glow: rgba(0,168,132,.26);
  --on-accent: #05251d;
  --wa-header: #202c33; --on-wa-header: #e9edef;
  --inverse: #e9edef; --on-inverse: #111b21; --inverse-hover: rgba(17,27,33,.1); --inverse-link: #008069;
  --danger: #f15c6d; --danger-soft: rgba(241,92,109,.14);
  --warning: #ffb74d; --warning-soft: rgba(255,183,77,.14); --warning-line: rgba(255,183,77,.35);
  --info: #53bdeb; --info-soft: rgba(83,189,235,.14);
  --chat-bg: #0b141a; --bubble-in: #202c33; --bubble-out: #005c4b; --bubble-text: #e9edef;
  --scrim: rgba(0,0,0,.5);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 2px 10px rgba(0,0,0,.45); --shadow-lg: 0 14px 40px rgba(0,0,0,.6);
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: var(--fs-md); line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: var(--radius-xs); }
.num { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100%; }
.side {
  background: var(--card); color: var(--text-soft); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 1px;
}
.brand {
  display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 var(--space-4);
  background: var(--wa-header); color: var(--on-wa-header); font-weight: 600; font-size: var(--fs-lg); letter-spacing: -0.02em;
}
.brand-tile { width: 30px; height: 30px; border-radius: 9px; background: var(--on-wa-header); color: var(--wa-header); display: grid; place-items: center; font-size: var(--fs-md); font-weight: 700; flex: none; }
.side-tenant { padding: 10px var(--space-4) var(--space-2); font-size: var(--fs-xs); font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); margin-bottom: var(--space-2); }
.nav-item {
  display: flex; align-items: center; gap: 10px; min-height: 42px; margin: 0 var(--space-2);
  padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 0; background: none; position: relative;
  color: var(--text-soft); text-align: start; font-size: var(--fs-md); font-weight: 500;
  transition: background-color var(--t-fast), color var(--t-fast);
}
.nav-item svg { opacity: .75; }
@media (hover: hover) { .nav-item:hover { background: var(--card-hover); color: var(--text); } }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item[aria-current="page"] svg { opacity: 1; }
.nav-item[aria-current="page"]::before { content: ""; position: absolute; inset-inline-start: 0; top: 9px; bottom: 9px; width: 3px; border-radius: var(--radius-pill); background: var(--accent-bright); }
.nav-count {
  margin-inline-start: auto; min-width: 22px; height: 22px; padding: 0 7px;
  border-radius: var(--radius-pill); background: var(--wa-green); color: var(--on-wa-green);
  font-size: var(--fs-2xs); font-weight: 700; display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.side-foot { margin-top: auto; font-size: var(--fs-xs); color: var(--muted); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); }
.main { min-width: 0; overflow: auto; }
.page { padding: var(--space-5) var(--space-6) var(--space-7); max-width: 1320px; }

/* ---------- page header ---------- */
.ph { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4); }
.ph h1 { margin: 0; font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -0.02em; }
.ph .sub { color: var(--muted); font-size: var(--fs-sm); }
.ph-actions { margin-inline-start: auto; display: flex; gap: var(--space-2); align-items: center; }
.search {
  display: flex; align-items: center; gap: var(--space-2); height: var(--hit); padding: 0 var(--space-3);
  background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); min-width: 240px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.search:focus-within { border-color: var(--accent-bright); box-shadow: 0 0 0 3px var(--accent-glow); }
.search input { border: 0; background: none; outline: none; width: 100%; font-size: var(--fs-sm); }
.kbd { font-size: var(--fs-2xs); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; line-height: 18px; font-family: ui-monospace, Menlo, monospace; }

/* ---------- pipeline strip ---------- */
.pipe {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; margin-bottom: var(--space-5);
}
.pipe-cell {
  background: var(--card); border: 0; padding: var(--space-3) var(--space-4); text-align: start;
  display: flex; flex-direction: column; gap: 2px; position: relative;
  transition: background-color var(--t-fast);
}
@media (hover: hover) { .pipe-cell:hover { background: var(--card-hover); } }
.pipe-cell[aria-pressed="true"] { background: var(--accent-soft); }
.pipe-cell[aria-pressed="true"]::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 2px; background: var(--accent-bright); }
.pipe-label { display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-xs); color: var(--muted); font-weight: 500; }
.pipe-n { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.pipe-n small { font-size: var(--fs-xs); font-weight: 400; color: var(--muted); margin-inline-start: var(--space-1); letter-spacing: 0; }
.pipe-bar { height: 3px; border-radius: 2px; background: var(--bg-sunken); overflow: hidden; margin-top: var(--space-1); }
.pipe-bar span { display: block; height: 100%; background: var(--line-control); border-radius: 2px; }
.pipe-cell[data-stage="won"] .pipe-bar span { background: var(--accent-bright); }

/* ---------- tabs + filters ---------- */
.bar { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: var(--space-3); }
.tabs { display: flex; gap: var(--space-1); overflow-x: auto; scrollbar-width: none; }
.tab {
  border: 0; background: none; min-height: 40px; padding: 0 var(--space-3); color: var(--muted);
  font-weight: 500; display: flex; align-items: center; gap: var(--space-2); position: relative; white-space: nowrap;
  transition: color var(--t-fast);
}
@media (hover: hover) { .tab:hover { color: var(--text); } }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: var(--space-2); bottom: -1px; height: 2px; border-radius: 2px; background: var(--text); }
.tab .c { font-size: var(--fs-2xs); font-weight: 600; padding: 1px 7px; border-radius: var(--radius-pill); background: var(--bg-sunken); color: var(--text-soft); font-variant-numeric: tabular-nums; }
.tab.needs .c { background: var(--wa-green); color: var(--on-wa-green); }
.filters { margin-inline-start: auto; display: flex; gap: var(--space-2); padding-bottom: var(--space-2); }
.fchip {
  height: 30px; padding: 0 var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--line-strong);
  background: var(--card); font-size: var(--fs-xs); color: var(--text-soft); display: flex; align-items: center; gap: 6px;
  transition: border-color var(--t-fast), background-color var(--t-fast);
}
@media (hover: hover) { .fchip:hover { border-color: var(--line-control); } }
.fchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }

/* ---------- list ---------- */
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.lhead, .row {
  display: grid; align-items: center; gap: var(--space-3);
  grid-template-columns: 28px minmax(180px, 1.3fr) 160px minmax(210px, 2fr) 185px 160px;
  padding: 0 var(--space-4);
}
.lhead { height: 38px; font-size: var(--fs-xs); font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg-elevated); letter-spacing: .02em; }
.row {
  min-height: 60px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative;
  transition: background-color var(--t-fast), opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
}
.row:last-child { border-bottom: 0; }
@media (hover: hover) { .row:hover { background: var(--card-hover); } }
.row.kb { background: var(--card-hover); box-shadow: inset 2px 0 0 var(--accent-bright); }
[dir="rtl"] .row.kb { box-shadow: inset -2px 0 0 var(--accent-bright); }
.row.active { background: var(--accent-soft); }
.row.leaving { opacity: 0; transform: translateY(-4px); }
.row.checked { background: var(--accent-soft); }
.cb { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.who { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.av {
  width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: var(--fs-xs); font-weight: 600; background: var(--bg-sunken); color: var(--text-soft); position: relative;
}
.av.lg { width: 44px; height: 44px; font-size: var(--fs-md); }
.av .ch { position: absolute; inset-inline-end: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--card); display: grid; place-items: center; }
.av .ch.wa { background: var(--wa-dot); }
.av .ch.ig { background: var(--text-soft); }
.who-t { min-width: 0; }
.name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.row.unread .name { font-weight: 600; }
.udot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-bright); flex: none; }
.handle { font-size: var(--fs-xs); color: var(--muted); }
.stand { font-size: var(--fs-sm); color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stand .nx { color: var(--text); }
.stand .nx svg { vertical-align: -3px; margin-inline-end: 4px; color: var(--muted); }
.last { font-size: var(--fs-xs); color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.last b { font-weight: 500; color: var(--text-soft); }
.win { display: inline-flex; align-items: center; gap: 4px; }
.win.warn { color: var(--warning); }
.row-actions {
  position: absolute; inset-inline-end: var(--space-3); top: 50%; transform: translateY(-50%);
  display: flex; gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); opacity: 0; pointer-events: none;
  transition: opacity var(--t-fast);
}
@media (hover: hover) { .row:hover .row-actions { opacity: 1; pointer-events: auto; } }
.row.kb .row-actions, .row:focus-within .row-actions { opacity: 1; pointer-events: auto; }
.ibtn {
  width: 30px; height: 30px; border: 0; background: none; border-radius: 6px; display: grid; place-items: center; color: var(--text-soft);
  transition: background-color var(--t-fast), transform var(--t-fast);
}
@media (hover: hover) { .ibtn:hover { background: var(--bg-sunken); color: var(--text); } }
.ibtn:active { transform: scale(0.94); }

/* stage chip */
.stage {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px 0 9px;
  border-radius: var(--radius-pill); font-size: var(--fs-xs); font-weight: 500; white-space: nowrap;
  border: 1px solid var(--line); background: var(--bg-elevated); color: var(--text-soft);
  transition: border-color var(--t-fast);
}
button.stage:hover { border-color: var(--line-control); }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line-control); }
.s-new .sdot { background: transparent; border: 1.5px solid var(--line-control); }
.s-talking .sdot { background: var(--line-control); }
.s-qualified .sdot { background: var(--info); }
.s-pending .sdot { background: var(--warning); }
.s-won { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.s-won .sdot { background: var(--accent-bright); }
.s-lost .sdot, .s-not_relevant .sdot { background: transparent; border: 1.5px dashed var(--line-control); }
.s-lost, .s-not_relevant { color: var(--muted); }
.manual { font-size: var(--fs-2xs); color: var(--muted); font-weight: 400; }

/* follow-up chip */
.fu { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--radius-pill); font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.fu .age { font-weight: 400; opacity: .8; }
.fu-handoff { background: var(--accent-soft); color: var(--accent); }
.fu-approval { background: var(--warning-soft); color: var(--warning); }
.fu-reminder { background: var(--info-soft); color: var(--info); }
.fu-cold { background: var(--bg-sunken); color: var(--text-soft); }
.fu-none { color: var(--muted); font-size: var(--fs-xs); }

/* empty + skeleton */
.empty { padding: var(--space-7) var(--space-5); text-align: center; color: var(--muted); display: grid; gap: var(--space-2); justify-items: center; }
.empty .big { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.empty strong { color: var(--text); font-size: var(--fs-lg); font-weight: 600; }

/* bulk bar */
.bulk {
  position: fixed; bottom: calc(var(--space-5) + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%;
  transform: translateX(-50%); display: flex; align-items: center; gap: var(--space-2);
  background: var(--inverse); color: var(--on-inverse); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); z-index: 30; font-size: var(--fs-sm);
}
[dir="rtl"] .bulk { transform: translateX(50%); padding: var(--space-2) var(--space-4) var(--space-2) var(--space-2); }
.bulk button { border: 0; background: var(--inverse-hover); color: inherit; height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-sm); font-size: var(--fs-sm); transition: background-color var(--t-fast), transform var(--t-fast); }
.bulk button:hover { background: var(--inverse-hover); }
.bulk button:active { transform: scale(0.97); }

/* ---------- buttons ---------- */
.btn {
  height: var(--hit); padding: 0 var(--space-4); border-radius: var(--radius-sm); border: 1px solid transparent;
  background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: var(--fs-sm);
  display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap;
  transition: background-color var(--t-fast), transform var(--t-fast);
}
@media (hover: hover) { .btn:hover { background: var(--accent-hover); } }
.btn:active { transform: scale(0.97); }
.btn2 {
  height: var(--hit); padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--line-control);
  background: var(--card); color: var(--text); font-weight: 500; font-size: var(--fs-sm);
  display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap;
  transition: background-color var(--t-fast), transform var(--t-fast);
}
@media (hover: hover) { .btn2:hover { background: var(--card-hover); } }
.btn2:active { transform: scale(0.97); }
.btn3 { height: 30px; padding: 0 var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: none; font-size: var(--fs-xs); color: var(--text-soft); transition: background-color var(--t-fast), border-color var(--t-fast); }
@media (hover: hover) { .btn3:hover { border-color: var(--line-control); color: var(--text); } }
.btn3:active { transform: scale(0.97); }

/* ---------- popover menu ---------- */
.pop {
  position: fixed; z-index: 60; min-width: 220px; background: var(--card); border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: var(--space-1);
  transform-origin: var(--origin, top); transition: opacity 140ms var(--ease-out), transform 140ms var(--ease-out);
}
@starting-style { .pop { opacity: 0; transform: scale(0.97); } }
.pop h6 { margin: 0; padding: var(--space-2) var(--space-3) var(--space-1); font-size: var(--fs-2xs); color: var(--muted); font-weight: 500; }
.pop button.mi {

/* ---------- state ---------- */
const S = {
  lang: "he", view: "leads", tab: "needs", stageF: null, chF: null, q: "",
  kb: 0, peekId: null, full: false, leadTab: "chat", tlF: 0, sel: new Set(),
};
let themePref = null;
const $ = (s, r = document) => r.querySelector(s);
const t = () => T[S.lang];
const nm = (l) => l[S.lang];
const tx = (o) => (o ? o[S.lang] : "");
const initials = (l) => nm(l).split(" ").map((p) => p[0]).slice(0, 2).join("");
const needs = (l) => l.fu && !l.snoozed && ACTIVE.includes(l.stage);

function visible() {
  let rows = L.filter((l) => {
    if (S.tab === "needs" && !needs(l)) return false;
    if (S.tab === "active" && !ACTIVE.includes(l.stage)) return false;
    if (S.tab === "won" && l.stage !== "won") return false;
    if (S.tab === "closed" && !["lost", "not_relevant"].includes(l.stage)) return false;
    if (S.stageF && l.stage !== S.stageF) return false;
    if (S.chF && l.ch !== S.chF) return false;
    if (S.q) {
      const q = S.q.toLowerCase();
      const hay = [l.he, l.en, l.h, tx(l.stand), tx(l.next)].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (S.tab === "needs") rows.sort((a, b) => FU_ORDER[a.fu] - FU_ORDER[b.fu] || b.fuMin - a.fuMin);
  else rows.sort((a, b) => a.lastMin - b.lastMin);
  return rows;
}

/* ---------- small renderers ---------- */
function stageChip(l, asBtn = false) {
  const lab = t().stages[l.stage];
  const inner = `<span class="sdot"></span>${lab}${asBtn ? ic("down", "sm") : ""}`;
  return asBtn
    ? `<button type="button" class="stage s-${l.stage}" data-act="stage" data-id="${l.id}" aria-haspopup="menu">${inner}</button>`
    : `<span class="stage s-${l.stage}">${inner}</span>`;
}
const FU_IC = { handoff: "hand", approval: "clock", reminder: "bell", cold: "cold" };
function fuChip(l) {
  if (l.snoozed) return `<span class="fu fu-cold">${ic("clock", "sm")}${t().snooze} · ${t().inDays(1)}</span>`;
  if (!needs(l)) {
    if (l.next) return `<span class="fu-none">${ic("bell", "sm")} ${t().inDays(l.nextDays)}</span>`;
    return `<span class="fu-none">—</span>`;
  }
  const age = l.fu === "reminder" ? t().due : t().ago(l.fuMin);
  return `<span class="fu fu-${l.fu}">${ic(FU_IC[l.fu], "sm")}${t().fu[l.fu]}<span class="age">· ${age}</span></span>`;
}
function standText(l) {
  if (l.next) return `<span class="nx">${ic("flag", "sm")}"${tx(l.next)}"</span>`;
  return tx(l.stand);
}
function lastCell(l) {
  const by = l.lastBy === "them" ? t().them : t().us;
  let win = "";
  if (l.ch === "wa" && ACTIVE.includes(l.stage)) {
    const left = Math.max(0, Math.round((1440 - l.lastMin) / 60));
    if (l.lastMin >= 1440) win = `<span class="win">${t().winClosed}</span>`;
    else if (left <= 3) win = `<span class="win warn">${ic("clock", "sm")}${t().winLeft(left)}</span>`;
  }
  return `<div class="last num"><b>${t().ago(l.lastMin)}</b><span>${by}${win ? " · " + win : ""}</span></div>`;
}
function av(l, lg = false) {
  return `<span class="av${lg ? " lg" : ""}" aria-hidden="true">${initials(l)}<span class="ch ${l.ch}"></span></span>`;
}

  document.title = n ? `(${n}) Zapidly · ${t().leads}` : `Zapidly · ${t().leads}`;

}

function renderMain() {
  const m = $("#main");
  if (S.view === "digest") { m.innerHTML = digestView(); return; }
  if (S.full && S.peekId) { m.innerHTML = fullView(L.find((l) => l.id === S.peekId)); bindLead(m); return; }
  m.innerHTML = listView();
  const s = $("#q");
  if (s && S._focusSearch) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); S._focusSearch = false; }
}

function listView() {
  const counts = {}; PIPE.forEach((p) => (counts[p] = L.filter((l) => l.stage === p).length));
  const maxC = Math.max(...Object.values(counts), 1);
  const tabN = {
    needs: L.filter(needs).length, active: L.filter((l) => ACTIVE.includes(l.stage)).length,
    won: counts.won, closed: L.filter((l) => ["lost", "not_relevant"].includes(l.stage)).length, all: L.length,
  };
  const rows = visible();
  if (S.kb >= rows.length) S.kb = Math.max(0, rows.length - 1);
  const body = rows.length
    ? rows.map((l, i) => rowView(l, i)).join("")
    : S.tab === "needs"
      ? `<div class="empty"><span class="big">${ic("check")}</span><strong>${t().needsEmptyT}</strong><span>${t().needsEmpty}</span></div>`
      : `<div class="empty"><strong>${t().emptyT}</strong><span>${t().empty}</span></div>`;
  return `<div class="page">
    <header class="ph">
      <h1>${t().leads}</h1>
      <div class="ph-actions">
        <label class="search">${ic("search")}<input id="q" type="search" placeholder="${t().search}" value="${S.q.replace(/"/g, "&quot;")}" aria-label="${t().search}"><span class="kbd">/</span></label>
      </div>
    </header>
    <div class="pipe" role="group" aria-label="Pipeline">
      ${PIPE.map((p) => `<button type="button" class="pipe-cell" data-stage="${p}" aria-pressed="${S.stageF === p}">
        <span class="pipe-label"><span class="stage s-${p}" style="height:auto;padding:0;border:0;background:none"><span class="sdot"></span></span>${t().stages[p]}</span>
        <span class="pipe-n">${counts[p]}${p === "won" ? `<small>${t().wonWindow}</small>` : ""}</span>
        <span class="pipe-bar"><span style="width:${(counts[p] / maxC) * 100}%"></span></span>
      </button>`).join("")}
    </div>
    <div class="bar">
      <div class="tabs" role="tablist">
        ${Object.keys(t().tabs).map((k) => `<button type="button" role="tab" class="tab ${k === "needs" ? "needs" : ""}" data-tab="${k}" aria-selected="${S.tab === k}">${t().tabs[k]}${tabN[k] ? `<span class="c">${tabN[k]}</span>` : ""}</button>`).join("")}
      </div>
      <div class="filters">
        <button type="button" class="fchip" data-ch="wa" aria-pressed="${S.chF === "wa"}">${t().fWa}</button>
        <button type="button" class="fchip" data-ch="ig" aria-pressed="${S.chF === "ig"}">${t().fIg}</button>
      </div>
    </div>
    <div class="list" role="grid" aria-label="${t().leads}">
      <div class="lhead" role="row">${t().cols.map((c, i) => `<span role="columnheader">${i === 0 ? "" : c}</span>`).join("")}</div>
      ${body}
    </div>
    <p class="hint">${t().keys}</p>
    ${S.sel.size ? `<div class="bulk" role="toolbar"><span>${t().selected(S.sel.size)}</span>
      <button type="button" data-act="bulk-stage">${t().bulkStage}</button>
      <button type="button" data-act="bulk-snooze">${t().bulkSnooze}</button>

      <button type="button" data-act="bulk-clear" aria-label="${t().close}">${ic("x")}</button></div>` : ""}
  </div>`;
}

function rowView(l, i) {
  const cls = ["row", l.unread ? "unread" : "", i === S.kb ? "kb" : "", S.peekId === l.id ? "active" : "", S.sel.has(l.id) ? "checked" : ""].join(" ");
  const snoozable = needs(l) && (l.fu === "cold" || l.fu === "reminder");
  return `<div class="${cls}" role="row" data-row="${l.id}" data-i="${i}" tabindex="-1">
    <span class="cbw" role="gridcell"><input type="checkbox" class="cb" data-sel="${l.id}" ${S.sel.has(l.id) ? "checked" : ""} aria-label="${nm(l)}"></span>
    <span class="who" role="gridcell">${av(l)}<span class="who-t"><span class="name">${l.unread ? '<span class="udot" aria-label="unread"></span>' : ""}${nm(l)}</span><span class="handle ltr">${l.h}</span></span></span>
    <span class="stg" role="gridcell">${stageChip(l, true)}</span>
    <span class="stand" role="gridcell">${standText(l)}</span>
    <span class="fuc" role="gridcell">${fuChip(l)}</span>
    <span role="gridcell" class="last">${lastCell(l)}</span>
    <span class="row-actions">
      <button type="button" class="ibtn" data-act="open" data-id="${l.id}" aria-label="${t().message}" title="${t().message}">${ic("msg")}</button>
      <button type="button" class="ibtn" data-act="next" data-id="${l.id}" aria-label="${t().nextStep}" title="${t().nextStep} (n)">${ic("flag")}</button>
      ${snoozable ? `<button type="button" class="ibtn" data-act="snooze" data-id="${l.id}" aria-label="${t().snooze}" title="${t().snooze} (z)">${ic("clock")}</button>` : ""}
    </span>
  </div>`;
}

function stepper(l) {
  const closed = ["lost", "not_relevant"].includes(l.stage);
  const cur = PIPE.indexOf(l.stage);
  const steps = PIPE.map((p, i) => {
    const c = closed ? "" : i < cur ? "done" : i === cur ? "cur" : "";
    return `<span class="st ${c}"><span class="pt"></span>${i < PIPE.length - 1 ? '<span class="ln"></span>' : ""}</span>`;
  }).join("");
  const labels = PIPE.map((p) => `<span class="${p === l.stage ? "cur" : ""}">${t().stages[p]}</span>`).join("");
  const why = l.src === "manual" ? `${t().manual} · ${S.lang === "he" ? "שונה ע״י שניר" : "set by Snir"}` : (t().autoWhy[l.stage] || t().auto);
  return `<div class="stepper">
    <div class="steps ${closed ? "closed" : ""}" aria-hidden="true">${steps}</div>
    <div class="step-labels">${labels}</div>
    <div class="stage-row">${stageChip(l, true)}<span class="src">${why}</span></div>
  </div>`;
}

function fuBar(l) {
  if (!needs(l)) return "";
  const closedWin = l.ch === "wa" && l.lastMin >= 1440;
  const cta = l.fu === "cold" && closedWin ? `${ic("phone")}${t().cta.coldPhone}` : l.fu === "reminder" ? `${ic("check")}${t().cta.reminder}` : l.fu === "cold" ? `${ic("msg")}${t().cta.cold}` : `${ic("inbox")}${t().cta[l.fu]}`;
  const sub = l.fu === "reminder" ? `"${tx(l.next)}" · ${t().due}` : `${t().ago(l.fuMin)}${l.fu === "cold" && closedWin ? " · " + t().winClosed : ""}`;
  const snz = l.fu === "cold" || l.fu === "reminder" ? `<button type="button" class="btn2" data-act="snooze" data-id="${l.id}">${ic("clock")}${t().snooze}</button>` : "";
  return `<div class="fubar fu-${l.fu}">
    <div class="t"><b>${ic(FU_IC[l.fu])}${t().fuLong[l.fu]}</b><span class="num">${sub}</span></div>
    ${snz}<button type="button" class="btn" data-act="cta" data-id="${l.id}">${cta}</button>
  </div>`;
}

function nextSec(l) {
  const body = l.next
    ? `<div class="next"><div class="txt"><b>${tx(l.next)}</b><span class="num">${ic("cal", "sm")} ${l.nextDays === 0 ? t().due : t().inDays(l.nextDays)}</span></div>
        <button type="button" class="btn3" data-act="done" data-id="${l.id}">${t().markDone}</button></div>`
    : `<div class="next"><div class="txt"><span>${t().noNext}</span></div></div>`;
  return `<section class="sec" aria-label="${t().nextStep}">
    <div class="sec-h">${ic("flag", "sm")}${t().nextStep}</div>${body}
    <div class="presets">${t().presets.map((p, i) => `<button type="button" class="btn3" data-act="preset" data-id="${l.id}" data-d="${[1, 3, 7][i]}">${p}</button>`).join("")}</div>
  </section>`;
}

function notesSec(l) {
  const ns = NOTES[l.id] || [];
  return `<section class="sec" aria-label="${t().notes}">
    <div class="sec-h">${ic("note", "sm")}${t().notes}${ns.length ? ` (${ns.length})` : ""}<span class="r">${t().notesHint}</span></div>
    ${ns.map((n) => `<div class="note ${n.pinned ? "pinned" : ""}"><p>${S.lang === "he" ? n.he : n.en}</p><small>${n.pinned ? ic("pin", "sm") : ""}${S.lang === "he" ? n.by : n.byEn} · ${n.min === 0 ? t().now : t().ago(n.min)}</small></div>`).join("")}

}

function timeline(l) {
  const he = S.lang === "he";

    ...(l.req ? [{ d: 0, k: 3, i: "cal", t: he ? "נוצרה בקשה: וילה עליונה, 12–15/10" : "Request created: upper villa, Oct 12–15", s: he ? "ע״י הבוט" : "By the bot", tm: "10:40" }] : []),
    ...(NOTES[l.id] || []).map((n) => ({ d: 1, k: 1 + 0, kk: "note", i: "note", t: he ? "נוספה הערה" : "Note added", s: he ? n.he : n.en, tm: "18:12" })),
    { d: 1, k: 2, i: "bot", t: he ? "הבוט שלח תזכורת (nudge)" : "Bot sent a nudge", s: he ? "אחרי שעה של שקט" : "After 1h of silence", tm: "11:05" },
    { d: 1, k: 1, i: "flag", t: he ? `השלב שונה ל"${t().stages.talking}"` : `Stage set to "${t().stages.talking}"`, s: he ? "אוטומטי · זוהתה כוונה" : "Auto · intent detected", tm: "10:02" },
    { d: 1, k: 0, i: "msg", t: he ? "שיחה התחילה ב-WhatsApp" : "Conversation started on WhatsApp", s: he ? "פתח את השיחה" : "Open conversation", tm: "10:00" },
  ];
  const f = S.tlF;
  const keep = items.filter((x) => f === 0 || (f === 1 && x.kk === "note") || (f === 2 && x.i === "flag") || (f === 3 && x.i === "cal"));
  const day = (d) => {
    const xs = keep.filter((x) => x.d === d);
    if (!xs.length) return "";
    return `<div class="tl-day">${d === 0 ? t().today : t().yesterday}</div><div class="tl-list">${xs.map((x) => `<div class="tl-item"><span class="tl-ic ${x.acc ? "acc" : ""}">${ic(x.i)}</span><span class="tl-t">${x.t}<small>${x.s}</small></span><span class="tl-time">${x.tm}</span></div>`).join("")}</div>`;
  };
  return `<div class="tl"><div class="tl-filters">${t().tlFilters.map((x, i) => `<button type="button" class="fchip" data-tlf="${i}" aria-pressed="${S.tlF === i}">${x}</button>`).join("")}</div>${day(0)}${day(1)}</div>`;
}

function detailsView(l) {
  const he = S.lang === "he";
  return `<section class="sec" style="border-top:0"><div class="sec-h">${t().details}</div>
    <dl class="dl"><dt>${he ? "שם" : "Name"}</dt><dd>${nm(l)}</dd><dt>${he ? "טלפון" : "Phone"}</dt><dd class="ltr">${l.ch === "wa" ? l.h : "—"}</dd><dt>${t().intent}</dt><dd>${tx(l.intent)}</dd>${l.req ? `<dt>${he ? "אורחים" : "Guests"}</dt><dd class="num">4</dd>` : ""}</dl></section>
    ${l.req ? `<section class="sec"><div class="sec-h">${t().requests}</div><div class="req"><b>${tx(l.stand)}</b><span class="muted">${t().stages.pending} · ${t().ago(l.fuMin || 120)}</span></div></section>` : ""}`;
}

function leadTabs(l) {
  return `<div class="lv-tabs" role="tablist">${Object.keys(t().tabsLead).map((k) => `<button type="button" role="tab" class="tab" data-ltab="${k}" aria-selected="${S.leadTab === k}">${t().tabsLead[k]}</button>`).join("")}</div>
  <div>${S.leadTab === "chat" ? chatView(l) : S.leadTab === "activity" ? timeline(l) : detailsView(l)}</div>`;
}

function headView(l) {
  return `<div class="lv-head">
    <div class="lv-id">${av(l, true)}<div><h2>${nm(l)}</h2>
      <div class="lv-meta"><span class="ltr">${l.h}</span><span>${t().intent}: ${tx(l.intent)}</span></div></div></div>
    ${stepper(l)}
  </div>${fuBar(l)}`;
}

function peekView(l) {
  return `<div class="peek-top"><span class="sp">${t().leads} / ${nm(l)}</span>
      <button type="button" class="ibtn" data-act="full" aria-label="${t().open}" title="${t().open}">${ic("expand")}</button>
      <button type="button" class="ibtn" data-act="close" aria-label="${t().close}" title="${t().close} (Esc)">${ic("x")}</button></div>
    <div class="peek-body">${headView(l)}${nextSec(l)}${notesSec(l)}<div style="border-top:1px solid var(--line)">${leadTabs(l)}</div></div>`;
}

function fullView(l) {
  return `<div class="page"><nav class="crumb"><button type="button" data-act="back">${t().back}</button><span>/</span><span>${nm(l)}</span></nav>
    <div class="full"><div class="full-main">${headView(l)}${leadTabs(l)}</div>
    <aside class="full-side">${nextSec(l)}${notesSec(l)}${S.leadTab !== "details" ? detailsView(l) : ""}</aside></div></div>`;
}

function digestView() {
  const he = S.lang === "he";
  const ns = L.filter(needs);
  const c = (r) => ns.filter((l) => l.fu === r).length;
  const top = ns.sort((a, b) => FU_ORDER[a.fu] - FU_ORDER[b.fu])[0];
  const tpl = he
    ? `בוקר טוב שניר, <b>${ns.length}</b> פניות צריכות אותך היום:<br>ממתינות לאישור: <b>${c("approval")}</b> · הועברו אליך: <b>${c("handoff")}</b> · תזכורות: <b>${c("reminder")}</b> · התקררו: <b>${c("cold")}</b><br>הדחופה ביותר: <b>${top ? nm(top) + " · " + tx(top.stand) : ""}</b>`
    : `Good morning Snir, <b>${ns.length}</b> leads need you today:<br>Awaiting approval: <b>${c("approval")}</b> · Handed to you: <b>${c("handoff")}</b> · Reminders: <b>${c("reminder")}</b> · Gone cold: <b>${c("cold")}</b><br>Most urgent: <b>${top ? nm(top) + " · " + tx(top.stand) : ""}</b>`;
  const full = ns.map((l) => `• ${nm(l)} · ${t().fu[l.fu]}`).join("<br>");
  return `<div class="page"><header class="ph"><h1>${t().digestTitle}</h1><span class="sub">${t().digestSub}</span></header>
    <div class="digest">
      <div class="phone" aria-label="WhatsApp preview"><div class="phone-h"><span class="brand-tile">Z</span><div><b>Zapidly</b><small>${he ? "חשבון עסקי" : "Business account"}</small></div></div>
        <div class="chat"><span class="chat-day">${t().today} · 08:00</span>
          <div class="bub in"><span>${tpl}</span><span class="tm num">08:00</span><div class="tpl-btn">${he ? "פתח ב-Zapidly" : "Open in Zapidly"}</div></div>
          <div class="bub out"><span>${he ? "תראה לי את כולן" : "Show me all of them"}</span><span class="tm num">08:14</span></div>
          <div class="bub in"><span>${full}</span><span class="tm num">08:14</span></div>
        </div></div>
      <div class="notes-card"><h3>${he ? "איך זה עובד" : "How it works"}</h3><ul>
        <li>${he ? "הודעה ראשונה = תבנית utility מאושרת ע״י Meta (מחוץ לחלון 24 השעות). פרמטרים בלי ירידות שורה." : "First message = a Meta-approved utility template (outside the 24h window). Parameters can't contain line breaks."}</li>
        <li>${he ? "כשהבעלים עונה, החלון נפתח והבוט שולח את הרשימה המלאה כטקסט חופשי." : "When the owner replies, the window opens and the bot sends the full list as free text."}</li>
        <li>${he ? "אפס פריטים = לא נשלחת הודעה." : "Zero items means no message is sent."}</li>
        <li>${he ? "דגלים:" : "Flags:"} <code>DIGEST_WHATSAPP_ENABLED</code> ${he ? "+ מתג לכל עסק + opt-in לכל משתמש." : "+ per-tenant toggle + per-user opt-in."}</li>
        <li>${he ? "שליחה פעם ביום, מוגן ע״י DigestLog(tenantId, date)." : "Sent once a day, guarded by DigestLog(tenantId, date)."}</li>
      </ul></div>
    </div></div>`;
}

/* ---------- peek ---------- */
function openPeek(id) {
  S.peekId = id; S.full = false;
  const l = L.find((x) => x.id === id);
  if (l.unread) l.unread = false;
  $("#peek").innerHTML = peekView(l);
  $("#peek").classList.add("on"); $("#scrim").classList.add("on");
  bindLead($("#peek"));
  renderShell();
}
function closePeek() {
  $("#peek").classList.remove("on"); $("#scrim").classList.remove("on");
  S.peekId = null; renderMain();
}
function refreshPeek() {
  if (!S.peekId) return;
  const l = L.find((x) => x.id === S.peekId);
  if (S.full) { renderMain(); return; }
  const sc = $(".peek-body")?.scrollTop || 0;
  $("#peek").innerHTML = peekView(l); bindLead($("#peek"));
  $(".peek-body").scrollTop = sc;
}
function bindLead(root) {
  root.querySelectorAll("textarea").forEach((ta) => ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addNote(+ta.id.split("-")[1]); }
  }));
}

/* ---------- actions ---------- */
function toast(msg, undo) {
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span>${msg}</span>${undo ? `<button type="button">${t().undo}</button>` : ""}`;
  $("#toasts").appendChild(el);
  const kill = () => { el.classList.add("out"); setTimeout(() => el.remove(), 200); };
  if (undo) el.querySelector("button").onclick = () => { undo(); kill(); };
  setTimeout(kill, 4500);
}
function leaveThen(id, fn) {
  const row = document.querySelector(`[data-row="${id}"]`);
  if (row && S.tab === "needs") { row.classList.add("leaving"); setTimeout(() => { fn(); }, 160); }
  else fn();
}
function snooze(id, days) {
  const l = L.find((x) => x.id === id); const prev = { ...l };
  const label = days === 1 ? t().snooze1 : days === 3 ? t().snooze3 : t().snooze7;
  leaveThen(id, () => { l.snoozed = true; renderShell(); refreshPeek();
    toast(t().snoozed(label), () => { Object.assign(l, prev); l.snoozed = false; renderShell(); refreshPeek(); }); });
}
function setStage(id, st) {
  const l = L.find((x) => x.id === id); const prev = { stage: l.stage, src: l.src, fu: l.fu };
  const exits = ["won", "lost", "not_relevant"].includes(st) && needs(l);
  const apply = () => { l.stage = st; l.src = "manual"; if (["won", "lost", "not_relevant"].includes(st)) l.fu = null; renderShell(); refreshPeek();
    toast(t().stageSet(t().stages[st]), () => { Object.assign(l, prev); renderShell(); refreshPeek(); }); };
  exits ? leaveThen(id, apply) : apply();
}
function setNext(id, days, text) {
  const l = L.find((x) => x.id === id); const prev = { next: l.next, nextDays: l.nextDays, fu: l.fu };
  l.next = text ? { he: text, en: text } : (l.next || { he: "לחזור לליד", en: "Follow up" });
  l.nextDays = days; if (l.fu === "cold" || l.fu === "reminder") l.fu = days === 0 ? "reminder" : null;
  leaveThen(id, () => { renderShell(); refreshPeek();
    toast(t().nextSet, () => { Object.assign(l, prev); renderShell(); refreshPeek(); }); });
}
function markDone(id) {
  const l = L.find((x) => x.id === id); const prev = { next: l.next, nextDays: l.nextDays, fu: l.fu };
  l.next = null; if (l.fu === "reminder") l.fu = null;
  leaveThen(id, () => { renderShell(); refreshPeek();
    toast(t().done, () => { Object.assign(l, prev); renderShell(); refreshPeek(); }); });
}
function addNote(id) {
  const ta = document.getElementById(`note-${id}`); const v = ta?.value.trim(); if (!v) return;
  (NOTES[id] ||= []).unshift({ he: v, en: v, by: "את/ה", byEn: "You", min: 0 });
  refreshPeek();
}

/* ---------- popovers ---------- */
let pop = null;
function closePop() { pop?.remove(); pop = null; }
function openPop(anchor, html, onClick) {
  closePop();
  pop = document.createElement("div"); pop.className = "pop"; pop.setAttribute("role", "menu"); pop.innerHTML = html;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect(); const pw = pop.offsetWidth; const ph = pop.offsetHeight;
  const rtl = S.lang === "he";
  let left = rtl ? r.right - pw : r.left; left = Math.max(8, Math.min(left, innerWidth - pw - 8));
  let top = r.bottom + 6; if (top + ph > innerHeight - 8) { top = r.top - ph - 6; pop.style.setProperty("--origin", "bottom"); }
  pop.style.left = left + "px"; pop.style.top = top + "px";
  pop.addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (b) { onClick(b.dataset.v); closePop(); } });
  pop.querySelector("button, input")?.focus();
}
function stagePop(anchor, ids) {
  const all = [...PIPE, "lost", "not_relevant"];
  openPop(anchor, `<h6>${t().stage}</h6>${all.map((s, i) => `<button type="button" class="mi" data-v="${s}"><span class="stage s-${s}" style="border:0;background:none;padding:0;height:auto"><span class="sdot"></span></span>${t().stages[s]}${i === 5 ? "" : ""}</button>${i === 4 ? "<hr>" : ""}`).join("")}`,
    (v) => ids.forEach((id) => setStage(id, v)));
}
function snoozePop(anchor, ids) {
  openPop(anchor, `<h6>${t().snooze}</h6>${[[1, t().snooze1], [3, t().snooze3], [7, t().snooze7]].map(([d, lab]) => `<button type="button" class="mi" data-v="${d}">${lab}</button>`).join("")}`,
    (v) => ids.forEach((id) => snooze(id, +v)));
}
function nextPop(anchor, id) {
  openPop(anchor, `<h6>${t().nextStep}</h6><div class="ns"><input type="text" id="ns-text" placeholder="${S.lang === "he" ? "למשל: להתקשר אחרי החג" : "e.g. Call after the holiday"}"></div>
    ${t().presets.map((p, i) => `<button type="button" class="mi" data-v="${[1, 3, 7][i]}">${ic("cal", "sm")}${p}</button>`).join("")}`,
    (v) => setNext(id, +v, document.getElementById("ns-text")?.value.trim()));
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  if (pop && !e.target.closest(".pop") && !e.target.closest("[data-act]")) closePop();
  const lang = e.target.closest("[data-lang]"); if (lang) { S.lang = lang.dataset.lang; syncMock(); renderShell(); refreshPeek(); return; }
  const th = e.target.closest("[data-theme-btn]"); if (th) { themePref = th.dataset.themeBtn; document.documentElement.dataset.theme = themePref; syncMock(); return; }
  const nav = e.target.closest("[data-view]"); if (nav) { const v = nav.dataset.view; if (v === "leads" || v === "digest") { S.view = v; S.full = false; closePeek(); renderShell(); } else toast(S.lang === "he" ? "לא חלק מהמוקאפ" : "Not part of this mockup"); return; }
  const tab = e.target.closest("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; S.stageF = null; S.kb = 0; renderMain(); return; }
  const ps = e.target.closest(".pipe-cell"); if (ps) { const st = ps.dataset.stage; S.stageF = S.stageF === st ? null : st; S.tab = "all"; S.kb = 0; renderMain(); return; }
  const chf = e.target.closest("[data-ch]"); if (chf) { S.chF = S.chF === chf.dataset.ch ? null : chf.dataset.ch; renderMain(); return; }
  const ltab = e.target.closest("[data-ltab]"); if (ltab) { S.leadTab = ltab.dataset.ltab; refreshPeek(); return; }
  const tlf = e.target.closest("[data-tlf]"); if (tlf) { S.tlF = +tlf.dataset.tlf; refreshPeek(); return; }
  const cb = e.target.closest("[data-sel]"); if (cb) { const id = +cb.dataset.sel; cb.checked ? S.sel.add(id) : S.sel.delete(id); renderMain(); return; }
  if (e.target.closest("#scrim")) { closePeek(); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const id = +a.dataset.id || S.peekId; const act = a.dataset.act;
    e.stopPropagation();
    if (act === "stage") return stagePop(a, [id]);
    if (act === "snooze") return snoozePop(a, [id]);
    if (act === "next") return nextPop(a, id);
    if (act === "open") return openPeek(id);
    if (act === "close") return closePeek();
    if (act === "full") { S.full = true; $("#peek").classList.remove("on"); $("#scrim").classList.remove("on"); renderMain(); $("#main").scrollTop = 0; return; }
    if (act === "back") { S.full = false; S.peekId = null; renderMain(); return; }
    if (act === "done") return markDone(id);
    if (act === "preset") return setNext(id, +a.dataset.d);
    if (act === "note") return addNote(id);
    if (act === "cta") { const l = L.find((x) => x.id === id); if (l.fu === "reminder") return markDone(id); toast(l.fu === "cold" ? (S.lang === "he" ? "פותח שיחה…" : "Opening chat…") : (S.lang === "he" ? "עובר לתיבת נכנסים…" : "Going to Inbox…")); S.leadTab = "chat"; return refreshPeek(); }
    if (act === "bulk-stage") return stagePop(a, [...S.sel]);
    if (act === "bulk-snooze") return snoozePop(a, [...S.sel].filter((i) => { const l = L.find((x) => x.id === i); return needs(l) && ["cold", "reminder"].includes(l.fu); }));
    if (act === "bulk-read") { S.sel.forEach((i) => (L.find((x) => x.id === i).unread = false)); S.sel.clear(); return renderShell(); }
    if (act === "bulk-clear") { S.sel.clear(); return renderMain(); }
  }
  const row = e.target.closest("[data-row]"); if (row) { S.kb = +row.dataset.i; openPeek(+row.dataset.row); }
});
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; S._focusSearch = true; S.kb = 0; renderMain(); } });
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input, textarea");
  if (e.key === "Escape") { if (pop) return closePop(); if (typing) return e.target.blur(); if (S.peekId && !S.full) return closePeek(); if (S.full) { S.full = false; S.peekId = null; return renderMain(); } }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || S.view !== "leads" || S.full) return;
  const rows = visible();
  const cur = rows[S.kb];
  const kbRow = () => document.querySelector(`[data-row="${cur?.id}"]`);
  if (e.key === "/") { e.preventDefault(); $("#q")?.focus(); }
  else if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); S.kb = Math.min(rows.length - 1, S.kb + 1); renderMain(); if (S.peekId) openPeek(rows[S.kb].id); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); S.kb = Math.max(0, S.kb - 1); renderMain(); if (S.peekId) openPeek(rows[S.kb].id); }
  else if (e.key === "Enter" && cur) openPeek(cur.id);
  else if (e.key === "s" && cur) { e.preventDefault(); stagePop(kbRow().querySelector(".stage"), [cur.id]); }
  else if (e.key === "n" && cur) { e.preventDefault(); nextPop(kbRow().querySelector(".stage"), cur.id); }
  else if (e.key === "z" && cur && needs(cur) && ["cold", "reminder"].includes(cur.fu)) { e.preventDefault(); snoozePop(kbRow().querySelector(".stage"), [cur.id]); }
});
function syncMock() {
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === S.lang));
  const eff = themePref || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.querySelectorAll("[data-theme-btn]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.themeBtn === eff));
}
syncMock();
renderShell();
})();
</script>
